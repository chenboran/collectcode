name: 打包通用启动器 Windows exe

on:
  workflow_dispatch:   # 手动点击触发
  push:
    branches: [ main ]
    paths:
      - 'launcher.py'
      - 'requirements.txt'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pyinstaller

      - name: 打包通用启动器底座 collectcode.exe
        run: |
          pyinstaller -F -w --name "collectcode" --collect-all tkinterdnd2 --collect-all reportlab --collect-all chardet launcher.py

      - name: 上传打包结果（含外部可随时修改的 py 脚本）
        uses: actions/upload-artifact@v4
        with:
          name: collectcode-bundle
          path: |
            dist/collectcode.exe
            files_report_gui.py
            http_ui.py
            llm_client.py