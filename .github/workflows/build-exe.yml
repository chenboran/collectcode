name: 打包为 Windows exe

on:
  workflow_dispatch:   # 手动点击触发
  push:
    branches: [ main ]
    paths:
      - 'files_report_gui.py'

jobs:
  build:
    runs-on: windows-latest   # 使用 GitHub 提供的云端 Windows 环境

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pyinstaller

      - name: 打包为单文件 exe（含 tkinterdnd2 资源文件）
        run: |
          pyinstaller -F -w --name "文件内容合集工具" --collect-all tkinterdnd2 files_report_gui.py

      - name: 上传打包结果
        uses: actions/upload-artifact@v4
        with:
          name: 文件内容合集工具-exe
          path: dist/文件内容合集工具.exe
